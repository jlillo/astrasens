<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">astrasens logo</title>
  <desc id="desc">A violet and magenta orbital detection mark with a sensitivity curve.</desc>
  <defs>
    <linearGradient id="plasma" x1="80" y1="430" x2="430" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B0F70"/>
      <stop offset=".38" stop-color="#8C2981"/>
      <stop offset=".7" stop-color="#DE4968"/>
      <stop offset="1" stop-color="#FDE725"/>
    </linearGradient>
    <linearGradient id="curve" x1="92" y1="390" x2="428" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B2CBF"/>
      <stop offset=".5" stop-color="#F72585"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent background: the mark works on light and dark README themes. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="256" cy="256" rx="164" ry="88" transform="rotate(-27 256 256)" stroke="url(#plasma)" stroke-width="18" opacity=".92"/>
    <path d="M76 386 C132 386 151 352 177 302 C205 248 232 226 267 240 C303 254 301 323 337 320 C372 317 379 216 439 169" stroke="url(#curve)" stroke-width="16"/>
    <path d="M77 386 C132 386 151 352 177 302 C205 248 232 226 267 240 C303 254 301 323 337 320 C372 317 379 216 439 169" stroke="#fff" stroke-width="3" opacity=".32"/>
  </g>

  <!-- Primary source and nearby companion. -->
  <circle cx="256" cy="256" r="47" fill="url(#plasma)" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="18" fill="#FDE725"/>
  <circle cx="361" cy="169" r="20" fill="#F72585" filter="url(#softGlow)"/>
  <circle cx="361" cy="169" r="8" fill="#FFB000"/>

  <!-- Tiny detection tick, reinforcing the measurement motif. -->
  <path d="M392 105 l12 12 24-28" fill="none" stroke="#FDE725" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
